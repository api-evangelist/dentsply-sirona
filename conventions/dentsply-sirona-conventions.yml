notes: >-
  Cross-cutting semantics for the three first-party intraoral imaging contracts Dentsply Sirona
  Imaging publishes on GitHub. The DS Core cloud API is excluded — its reference is behind the
  open.dscore.com partner login and nothing about its conventions is publicly observable.
authentication:
  style: HTTP Basic (username + Dentsply-issued API key as password)
  docs: https://github.com/dsimaging/dsio-modality-api/wiki/Authentication
  see: authentication/dentsply-sirona-authentication.yml
  note: >-
    The Filters API declares no securityScheme at all; it is a loopback service on the same
    workstation. The Exposure API specification applies an X-API-Key header globally.
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  retention: null
  evidence: >-
    No Idempotency-Key header, parameter or extension appears in any of the three specs, and no
    replay-protection guidance appears in the wiki or the Recommendations document. The four
    write operations (createAcquisitionSession, updateAcquisitionSession, createImage,
    modalityImage) are unprotected: a retried createAcquisitionSession either opens a second
    session or returns 409 depending on device state, and a retried createImage creates a second
    image resource that must be deleted separately.
  note: >-
    PUT operations (updateAcquisitionSession, setAcquisitionInfo) are idempotent by HTTP method
    semantics, but method semantics are not a replay-protection contract and are not counted here.
pagination:
  style: offset
  applies_to:
  - openapi/dentsply-sirona-intraoral-exposure-openapi.yml#getExposures
  request_params:
  - name: skip
    meaning: number of exposures to skip
  - name: limit
    meaning: maximum exposures to return; maximum permitted value 50
  - name: startTime
    meaning: oldest exposure to return (RFC 3339)
  - name: endTime
    meaning: newest exposure to return (RFC 3339)
  response_fields:
  - total
  - skip
  - limit
  - exposures
  note: >-
    Only one operation across all three APIs is paginated. The modality and filters collections
    (getAllDevices, getSessions, getImages) return unbounded arrays with no paging envelope,
    because they are bounded by the hardware attached to one workstation.
