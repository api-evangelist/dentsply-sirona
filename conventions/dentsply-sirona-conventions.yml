reversibility:
  grade: documented
  summary: >-
    Every create in this surface has a matching delete, and the provider documents that a filter
    image resource should be deleted when work is finished. No reversal WINDOW is stated anywhere,
    so this grades `documented`, not `verified`. The `expires` field on an image resource carries
    a per-resource timestamp, but the retention DURATION behind it is never published — the only
    figure available is an example value in the schema, which is not a stated policy and is not
    recorded here as one.
  write_surfaces:
  - operation: createAcquisitionSession
    method: POST
    reversal: deleteAcquisitionSession
    reversal_method: DELETE
    window: null
    window_source: null
    note: >-
      Closes the session and releases the device. Whether images captured in the session survive
      deletion is not documented.
  - operation: updateAcquisitionSession
    method: PUT
    reversal: null
    window: null
    note: >-
      No undo. A PUT overwrites the session's device binding; the previous value is not retrievable.
  - operation: setAcquisitionInfo
    method: PUT
    reversal: null
    window: null
    note: >-
      No undo, but the operation is blocked with 423 Locked while an exposure is being read, which
      is the only safety interlock in the surface.
  - operation: createImage
    method: POST
    reversal: deleteImage
    reversal_method: DELETE
    window: null
    window_source: >-
      openapi/dentsply-sirona-intraoral-filters-openapi.yml — "the resource will be automatically
      deleted after the `expires` timestamp"; the duration is not stated.
  - operation: modalityImage
    method: POST
    reversal: deleteImage
    reversal_method: DELETE
    window: null
    window_source: >-
      "This resource will only be available as long as the modality session is active" — bounded by
      session lifetime, no duration published.
  - operation: filterSelect / filterSupreme / filterAE / unmapImage
    method: POST
    reversal: not-applicable
    window: null
    note: >-
      These POSTs compute and return a filtered PNG; they do not mutate stored state, so there is
      nothing to reverse. unmapImage returns the raw rendering, which is the practical undo of
      applying a filter to a displayed image.
  read_only_apis:
  - openapi/dentsply-sirona-intraoral-exposure-openapi.yml
  note_read_only: >-
    The Intraoral Exposure API has no write operations at all — reversibility, dry_run_mode and
    idempotency are `na` for that contract.
