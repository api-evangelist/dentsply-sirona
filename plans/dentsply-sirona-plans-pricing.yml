plans:
  - id: ds-core-access
    name: DS Core Access
    type: free
    price: 0
    currency: USD
    period: month
    description: >-
      "For practices that only want to send orders to labs." Described on the page as the Connect
      Case Center replacement.
    limits:
      - Order sending to labs only
    elements:
      - name: DS Core platform
  - id: ds-core-light
    name: DS Core Light
    type: subscription
    price: 19.95
    currency: USD
    period: month
    description: >-
      "For small dental practices (with 1-2 dentists) with an estimated usage of up to 90 DI scan
      and X-ray uploads / acquisitions per month."
    included_quota:
      metric: DI scan and X-ray uploads / acquisitions
      amount: 90
      period: month
      note: >-
        Stated as an estimated usage recommendation, not an enforced cap. The footnote reads
        "DS Core subscriptions support an unlimited number of users, however usage must align with
        the outlined recommendations from the order forms of DS Core per tier."
    trial:
      length: 3 months
      terms: >-
        "You can try all the features of DS Core Light for 3 months prior to subscribing. You can
        terminate your DS Core Light subscription at any time during the first 3 months prior to
        your first payment being due."
    elements:
      - name: DS Core platform
  - id: ds-core-standard
    name: DS Core Standard
    type: subscription
    price: 99.95
    currency: USD
    period: month
    description: >-
      "For medium dental practices (with 3-5 dentists) with an estimated usage of up to 270 DI scan
      and X-ray uploads / acquisitions per month."
    included_quota:
      metric: DI scan and X-ray uploads / acquisitions
      amount: 270
      period: month
    elements:
      - name: DS Core platform
  - id: ds-core-advanced
    name: DS Core Advanced
    type: subscription
    price: 249.95
    currency: USD
    period: month
    description: >-
      "For large dental practices (with 5-10 dentists) with an estimated usage of up to 540 DI scan
      and X-ray uploads / acquisitions per month."
    included_quota:
      metric: DI scan and X-ray uploads / acquisitions
      amount: 540
      period: month
    elements:
      - name: DS Core platform
unpriced_surfaces:
  - api: DS Core API
    note: >-
      No published price for API access, partner integration, or per-call usage. Access is granted
      through the DS Core partner programme after an eligibility review at open.dscore.com.
  - api: Dentsply Sirona Intraoral Imaging Modality API
    note: >-
      No price. The API is free to use; the API key is issued by Dentsply Sirona to approved
      developers, and the SDK is MIT-licensed. The commercial gate is the sensor hardware.
  - api: Dentsply Sirona Intraoral Imaging Filters API
    note: No price; MIT-licensed SDK, local service.
  - api: Intraoral Exposure API
    note: >-
      No price. Apache-2.0 specification for generator vendors to implement; Dentsply Sirona hosts
      nothing.
overage: null
enterprise:
  contact_sales: true
  note: >-
    DS Core Enterprise for DSOs (with SSO user provisioning) is sold through sales, not published
    pricing.
