plan_count: 4
notes: >-
  Rewritten 2026-09-06. The previous version of this file was a 2026-05-04 bulk-sweep scaffold that
  asserted "Dentsply Sirona does not publish self-serve API pricing" and cited
  https://developer.dscore.com/, a host that does not resolve. That was wrong: Dentsply Sirona
  publishes four named DS Core tiers with list prices, on its own site, in USD. The tiers below are
  quoted verbatim from that page. IMPORTANT DISTINCTION: this is PLATFORM pricing, not API pricing.
  Nothing published prices API access, per-call usage, or partner integration; API access rides on
  a DS Core subscription and on the DS Core partner agreement, whose terms are bilateral.
description: >-
  DS Core is sold as a four-tier monthly subscription banded by practice size and expected upload
  volume, plus a free Access tier for practices that only send orders to labs. Subscriptions carry
  unlimited users; the tier is chosen against an estimated monthly count of digital-impression scan
  and X-ray uploads. There is no published API-specific plan, no per-call price, and no published
  quota expressed in API terms.
