  - aid: dentsply-sirona:dsio-modality-api
    name: Dentsply Sirona Intraoral Imaging Modality API
    description: >-
      A 17-operation OpenAPI 3.0.1 contract for acquisition and control of Dentsply Sirona
      intraoral sensors. Devices operations retrieve names, icons, battery and status for connected
      USB and WiFi sensor interfaces; Acquisition operations open a capture session, arm the sensor
      with per-exposure AcquisitionInfo, and retrieve the resulting image media and previews. Two
      Server-Sent Events channels push device events and acquisition-status transitions. This is a
      LOCAL service: it runs as the Sensor Plugin service on the practice workstation, so its
      declared server is https://localhost:43809/api/dsio/modality/v1 rather than a cloud host.
      Authentication is HTTP Basic with an API key Dentsply Sirona issues directly to approved
      developers.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://github.com/dsimaging/dsio-modality-api
    baseURL: https://localhost:43809/api/dsio/modality/v1
