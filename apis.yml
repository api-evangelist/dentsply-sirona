  - aid: dentsply-sirona:dsio-filters-api
    name: Dentsply Sirona Intraoral Imaging Filters API
    description: >-
      A 9-operation OpenAPI 3.0.1 contract for applying Dentsply Sirona's Select, Supreme and AE
      image filters to 16-bit grayscale intraoral images. An image resource is created either by
      uploading a PNG or by referencing a capture in a live Modality API acquisition session, then
      filters are applied and the filtered PNG returned; the resource is transient and carries an
      `expires` timestamp after which it is deleted. Like the Modality API it is a LOCAL service on
      the practice workstation, and it declares no security scheme because it is reached over
      loopback.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
