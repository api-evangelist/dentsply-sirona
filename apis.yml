  - aid: dentsply-sirona:io-exposure-api
    name: Intraoral Exposure API
    description: >-
      A 4-operation, read-only OpenAPI 3.0.0 contract for exchanging intraoral X-ray exposure dose
      information, so exposure data can be stored alongside a patient's media and dental record.
      It is a SPECIFICATION Dentsply Sirona published for X-ray tube generator vendors to
      implement, not a service Dentsply Sirona hosts — the only server the document declares is a
      SwaggerHub auto-mock, and the companion Recommendations document tells implementers to choose
      their own versioned endpoint and announce it over mDNS as `_io-exposure._tcp`. The repository
      is archived. Licensed Apache 2.0; contact John.Goyette@dentsplysirona.com.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://github.com/dsimaging/io-exposure-service
    baseURL: https://virtserver.swaggerhub.com/JohnGoyette/intraoral-exposure-service/1.0
