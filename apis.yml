aid: dentsply-sirona
name: Dentsply Sirona
description: >-
  Dentsply Sirona is the world's largest manufacturer of professional dental products and
  technologies, providing solutions for dentists, dental laboratories, and dental specialists
  worldwide. Its public API surface has two halves that behave nothing alike. DS Core is the
  company's open cloud platform, whose API lets practice-management vendors, lab-management
  vendors and DSOs integrate patient data synchronization, scan and imaging exchange, lab order
  routing, file and comment exchange, and SSO user provisioning — but its reference sits behind a
  partner login and no machine-readable contract for it is public. The Dentsply Sirona Imaging
  team, by contrast, publishes three real OpenAPI 3.0 contracts openly on GitHub under MIT and
  Apache licences — the Intraoral Imaging Modality API, the Intraoral Imaging Filters API, and the
  Intraoral Exposure API — covering 30 operations for driving intraoral sensors, filtering acquired
  images, and reading X-ray tube generator dose records. Notably, none of the three references
  DICOM.
