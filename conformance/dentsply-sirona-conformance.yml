notes: >-
  Standards conformance read from the contracts themselves, not from marketing prose. The headline
  finding is a negative one and it matters for this market: three intraoral imaging APIs, and not
  one of them references DICOM. Images move as PNG and TIFF with a bespoke JSON metadata envelope,
  and exposure dose records use a bespoke Exposure schema rather than a DICOM Radiation Dose
  Structured Report. A dental software vendor that already speaks DICOM needs a bespoke connector
  for each of these three surfaces.
