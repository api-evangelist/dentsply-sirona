notes: >-
  Rewritten 2026-09-06 by the enrichment pipeline. The previous version of this file was a
  2026-05-04 bulk-sweep scaffold: it asserted a partner tier and 429/503 response codes that the
  provider has never published, and it cited https://developer.dscore.com/, a host that does not
  resolve. Those are removed. The honest finding: Dentsply Sirona publishes NO rate limits for any
  of its four APIs. The three intraoral imaging OpenAPI documents declare no 429 response, no
  Retry-After, and no RateLimit-* or X-RateLimit-* header on any of their 30 operations. The DS
  Core API reference is behind the open.dscore.com partner login, so any limits it documents are
  not publicly observable. A consumer learns the limits, if any, from a partner agreement.
description: >-
  No published rate limits. The two intraoral imaging APIs are LOCAL services running on the
  practice workstation, where the binding constraint is the sensor and the workstation rather than
  a server-side quota — the contract's own backpressure signals are 409 (device in use), 423
  (locked while reading an exposure) and 507 (insufficient storage), not 429.
